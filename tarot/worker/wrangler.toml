name = "tarot-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Set your API key as a secret (never commit it):
#   wrangler secret put ANTHROPIC_API_KEY
#
# After deploying, note your worker URL from the output, then set
# VITE_WORKER_URL in your tarot/.env (and as a GitHub Actions secret).

# New Horizons relay poll storage. Create once with:
#   npx wrangler kv namespace create RELAY_POLL
# then paste the printed id below.
[[kv_namespaces]]
binding = "RELAY_POLL"
id = "6398c6fafe334b4f9decf35de6c6f77f"
